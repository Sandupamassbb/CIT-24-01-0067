services:

  web:

    build: .

    container_name: flask-app

    restart: always

    ports:

      - "5000:5000"

    environment:

      DB_HOST: db

      DB_USER: student

      DB_PASSWORD: student123

      DB_NAME: assignmentdb

    depends_on:

      - db



  db:

    image: mysql:8.0

    container_name: mysql-db

    restart: always

    environment:

      MYSQL_ROOT_PASSWORD: root123

      MYSQL_DATABASE: assignmentdb

      MYSQL_USER: student

      MYSQL_PASSWORD: student123

    volumes:

      - mysql_data:/var/lib/mysql



volumes:

  mysql_data:
